# AvocadoDB Phase 2.5 - Local LLM Integration Strategy
# Fine-tune local models for codebase Q&A with deterministic RAG

metadata:
  project: AvocadoDB
  phase: 2.5
  version: 1.0.0
  duration: 8_weeks
  start_date: "2025-05-01"  # After Phase 2 core (sessions + memory)
  core_objective: "Enable self-contained codebase Q&A with local LLM + AvocadoDB RAG"
  success_metric: "Local model answers codebase questions with 85%+ accuracy, maintains determinism, generates citations"

# Global configuration
global_config:
  repository: "github.com/avocadodb/avocadodb"
  language: python  # Training pipeline in Python
  rust_core: true   # Uses AvocadoDB Rust core
  
  tech_stack:
    training_framework: "transformers + peft (LoRA)"
    inference_engine: "vLLM"  # For fast inference
    quantization: "bitsandbytes (4-bit)"
    evaluation: "custom + semantic similarity"
    data_generation: "GPT-4 Turbo"
    
  model_options:
    # Start with smallest, iterate up
    week_1_proof_of_concept: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"  # 1.1B - fastest iteration
    week_2_validation: "microsoft/phi-2"  # 2.7B - often sufficient
    week_3_scaling: "StableLM/stablelm-2-1_6b-instruct"  # 1.6B - good middle ground
    primary_fine_tuning: "microsoft/phi-3-mini"  # 3.8B - balanced (if needed)
    alternatives:
      - "meta-llama/Llama-3.2-1B-Instruct"  # Smaller, faster
      - "Qwen/Qwen2.5-Coder-1.5B-Instruct"  # Code-specialized
      - "deepseek-ai/DeepSeek-Coder-1.3B-Instruct"  # Fastest

# Strategic approach: Three paths
strategic_paths:
  path_1_rag_only:
    name: "Pure RAG (MVP)"
    timeline: "1 week"
    description: "Use AvocadoDB + small base model, no fine-tuning"
    pros:
      - Fastest to deploy
      - Always up-to-date
      - Perfect citations
      - No training needed
    cons:
      - Slower inference (200-500ms)
      - Requires API for embeddings
    recommendation: "Start here to validate approach"

  path_2_fine_tuned:
    name: "Fine-tuned Model (Recommended)"
    timeline: "4-6 weeks"
    description: "Fine-tune small model on AvocadoDB-generated training data"
    pros:
      - Faster inference (50-200ms)
      - Better codebase understanding
      - Can run fully local
    cons:
      - Requires training infrastructure
      - Must maintain determinism
      - Needs retraining on major changes
    recommendation: "Primary path after RAG validation"

  path_3_hybrid:
    name: "Hybrid RAG + Fine-tuned"
    timeline: "6-8 weeks"
    description: "Fine-tuned model + RAG for verification"
    pros:
      - Best accuracy
      - Fast + verifiable
      - Handles edge cases
    cons:
      - Most complex
      - Higher latency
    recommendation: "For production systems requiring highest accuracy"

# Implementation phases
phases:
  phase_1_foundation:
    name: "Foundation & RAG-Only MVP"
    weeks: 1-2
    objective: "Validate approach with ultra-simple RAG-only system"
    strategy: "Start with 10 queries + TinyLlama, prove it works, then scale"
    
    deliverables:
      - task: ultra_minimal_poc
        priority: CRITICAL
        description: "Ultra-minimal POC - 1 file, 1 query (can run TODAY)"
        output:
          - file: "tools/local_llm/week1_poc.py"
            script: |
              # Week 1: Ultra-minimal proof of concept - Can run TODAY
              # Start with absolute minimum: 1 file, 1 query, 1 model
              
              from avocado import AvocadoDB
              from transformers import pipeline
              
              def test_minimal_poc():
                  """Test with absolute minimum to prove concept works."""
                  
                  # 1. Index just ONE file first (not everything)
                  db = AvocadoDB()
                  db.ingest("./avocado-core/src/compiler.rs")  # Just one file!
                  
                  # 2. Test ONE query with ONE model
                  model = pipeline(
                      "text-generation", 
                      model="TinyLlama/TinyLlama-1.1B-Chat-v1.0"
                  )
                  
                  query = "How does the compile function work?"
                  context = db.compile(query, budget=1024)
                  
                  # 3. Simple prompt
                  prompt = f"Based on this code:\n{context.text}\n\nQ: {query}\nA:"
                  answer = model(
                      prompt, 
                      max_length=200, 
                      temperature=0.0,
                      do_sample=False
                  )
                  
                  print(f"Query: {query}")
                  print(f"Answer: {answer}")
                  print(f"Citations: {len(context.citations)}")
                  print(f"Context spans: {len(context.spans)}")
                  print("\n---")
                  print("Makes sense? Has citations? Deterministic?")
                  
                  # Test determinism
                  answer2 = model(prompt, max_length=200, temperature=0.0, do_sample=False)
                  is_deterministic = (answer == answer2)
                  print(f"Deterministic: {is_deterministic}")
                  
                  return {
                      "query": query,
                      "answer": answer,
                      "citations": context.citations,
                      "deterministic": is_deterministic,
                      "context_spans": len(context.spans)
                  }
              
              # If this works, scale to 10 queries, then 100, then 500+
              if __name__ == "__main__":
                  result = test_minimal_poc()
                  if result["deterministic"] and len(result["citations"]) > 0:
                      print("\n✅ POC SUCCESS! Proceed to 10 queries.")
                  else:
                      print("\n⚠️ POC needs improvement. Fix issues before scaling.")
            success_criteria:
              - "1 query returns an answer"
              - "Answer makes sense (human evaluation)"
              - "Citations are present"
              - "Deterministic (same query → same answer, 2 runs)"
              - "Can run in < 5 minutes"
            decision: "If this works → scale to 10 queries. If not → fix RAG first."
        
      - task: ultra_simple_poc
        priority: CRITICAL
        description: "Scale to 10 queries after minimal POC succeeds"
        output:
          - file: "tools/local_llm/poc_10_queries.py"
            script: |
              # Week 1: Scale to 10 queries after minimal POC succeeds
              def test_rag_only_10_queries():
                  db = AvocadoDB()
                  db.ingest("./avocado-core/src")  # Now index core module
                  
                  # 10 test queries
                  test_queries = [
                      "How does span extraction work?",
                      "What is the MMR algorithm?",
                      "How do we ensure determinism?",
                      "What is the database schema?",
                      "How does token packing work?",
                      "What is the compiler architecture?",
                      "How are embeddings generated?",
                      "What is the span-based approach?",
                      "How does hybrid fusion work?",
                      "What are the core data structures?"
                  ]
                  
                  # Use tiny model without fine-tuning
                  model = load_model("TinyLlama/TinyLlama-1.1B-Chat-v1.0")
                  
                  results = []
                  for query in test_queries:
                      context = db.compile(query, budget=2048)
                      answer = model.generate(
                          f"Context: {context.text}\nQ: {query}\nA:",
                          temperature=0.0,
                          do_sample=False
                      )
                      results.append({
                          "query": query,
                          "answer": answer,
                          "citations": context.citations,
                          "context_used": len(context.spans)
                      })
                      print(f"Query: {query}")
                      print(f"Answer: {answer[:200]}...")
                      print(f"Citations: {len(context.citations)}")
                      print("---")
                  
                  return results
            success_criteria:
              - "All 10 queries return answers"
              - "Answers are factually correct (>70% accuracy)"
              - "Citations are present and valid"
              - "Deterministic (same query → same answer)"
              - "Latency acceptable (<500ms)"
            decision: "If 10 queries work → proceed to Week 2 (100 queries). If not → improve RAG."
        
      - task: setup_rag_system
        priority: CRITICAL
        description: "Create RAG-only codebase Q&A service (after POC validation)"
        output:
          - file: "tools/local_llm/rag_service.py"
            classes:
              - CodebaseQAService
              - AvocadoDBRAG
            features:
              - AvocadoDB context retrieval
              - Small base model synthesis (no fine-tuning)
              - Citation formatting
              - Response generation
              - Determinism testing
        
      - task: index_codebase
        priority: CRITICAL
        description: "Index entire AvocadoDB codebase"
        output:
          - script: "tools/local_llm/index_codebase.sh"
            actions:
              - Index avocado-core/src
              - Index avocado-server/src
              - Index avocado-cli/src
              - Index docs/
              - Index README, vision docs
        
      - task: rag_evaluation
        priority: CRITICAL
        description: "Create evaluation framework for RAG system"
        output:
          - file: "tools/local_llm/evaluation.py"
            classes:
              - RAGEvaluator
            metrics:
              - Answer accuracy (semantic similarity)
              - Citation accuracy
              - Latency
              - Context utilization
              - Determinism (100 runs, same query)
        
      - task: determinism_testing_rigorous
        priority: CRITICAL
        description: "Rigorous determinism testing under load"
        output:
          - file: "tools/local_llm/test_determinism.py"
            test: |
              def test_determinism_under_load():
                  """The real determinism test"""
                  query = "How does span extraction work?"
                  
                  # Run 100 times with different conditions
                  results = []
                  for i in range(100):
                      # Clear caches, restart model, vary system load
                      if i % 10 == 0:
                          restart_model()
                      
                      context = db.compile(query)
                      answer = model.generate(
                          prompt=format_prompt(query, context),
                          temperature=0.0,
                          seed=42,
                          do_sample=False  # Critical!
                      )
                      results.append(hash(answer))
                  
                  assert len(set(results)) == 1, f"Non-deterministic! {len(set(results))} unique answers"
                  return True
            requirement: "100% deterministic - non-negotiable"
        
      - task: test_set_creation
        priority: CRITICAL
        description: "Create test set of 100 Q&A pairs"
        output:
          - file: "tools/local_llm/test_set.json"
            format: |
              {
                "query": "How does span extraction work?",
                "expected_answer": "...",
                "expected_citations": [...],
                "category": "core_functionality"
              }
            categories:
              - Core functionality
              - Architecture
              - API usage
              - Algorithms
              - Error handling

    success_criteria:
      day_1_minimal_poc:
        - "1 file indexed, 1 query tested"
        - "Answer makes sense (human evaluation)"
        - "Citations present"
        - "Deterministic (2 runs, same answer)"
        - "Can run in < 5 minutes"
        decision: "If works → scale to 10 queries. If not → fix RAG first."
      
      week_1_poc:
        - "10 test queries return answers"
        - "Answers are factually correct (>70% accuracy)"
        - "Citations are present and valid"
        - "Deterministic (same query → same answer)"
        - "Latency acceptable (<500ms)"
        decision: "If Week 1 succeeds → proceed to Week 2. If not → improve RAG first."
      
      week_2_validation:
        - "RAG system answers questions with 80%+ accuracy"
        - "Citations are 95%+ accurate"
        - "Latency < 500ms"
        - "100% deterministic (100-run test passes)"
        - "Test set created (100 examples)"
        - "Evaluation framework working"
        decision: "If Week 2 succeeds → proceed to training data. If not → stick with RAG-only."

  phase_2_training_data:
    name: "Training Data Generation"
    weeks: 3-4
    objective: "Generate high-quality training data using GPT-4"
    
    deliverables:
      - task: training_data_generator
        priority: CRITICAL
        description: "Generate Q&A pairs from codebase queries"
        output:
          - file: "tools/local_llm/training_data_generator.py"
            classes:
              - TrainingDataGenerator
            methods:
              - generate_qa_pairs(queries: List[str]) -> List[Dict]
              - generate_answer_with_gpt4(query: str, context: str) -> str
              - format_citation_training() -> List[Dict]
              - export_for_fine_tuning(format: str) -> None
        
      - task: query_generation
        priority: CRITICAL
        description: "Generate comprehensive query set (start small, scale up)"
        output:
          - file: "tools/local_llm/queries.json"
            strategy: |
              Week 3: Start with 100 queries
              - If validation passes, scale to 500-1000
              - Use hierarchical generation (50 gold + 450 synthetic)
            count: "100 queries (Week 3), scale to 500-1000 if needed"
            categories:
              - How does X work? (20-200 queries)
              - What is the architecture of Y? (15-150 queries)
              - How do I use API Z? (15-150 queries)
              - What are the algorithms? (10-100 queries)
              - Error handling patterns (10-100 queries)
              - Performance characteristics (10-100 queries)
              - Testing strategies (10-100 queries)
              - Integration examples (10-100 queries)
        
      - task: answer_generation
        priority: CRITICAL
        description: "Generate answers using hierarchical strategy (cost-effective)"
        strategy: |
          # Hierarchical data generation (cost-effective)
          
          Step 1: Generate 50 "gold standard" examples with GPT-4
          - Use GPT-4 for highest quality
          - Cover all major categories
          - Validate thoroughly
          - Cost: ~$5-10
          
          Step 2: Fine-tune small model on gold examples
          - Use TinyLlama or Phi-2
          - Quick fine-tune (1-2 hours)
          - Creates "answer generator" model
          - Cost: GPU time only
          
          Step 3: Use fine-tuned model to generate more examples
          - Generate 450+ additional examples
          - Much cheaper than GPT-4 (free if local)
          - Still high quality (trained on gold)
          - Cost: ~$0 (local) vs $50-100 (GPT-4)
          
          Step 4: Validate and filter synthetic examples
          - Check all facts in context
          - Validate citations
          - Ensure answers the question
          - Remove hallucinations
          
          Result: 500+ high-quality examples at fraction of cost
        output:
          - file: "tools/local_llm/gold_examples.jsonl"
            count: "50 examples"
            source: "GPT-4"
            cost: "~$5-10"
          - file: "tools/local_llm/synthetic_examples.jsonl"
            count: "450+ examples"
            source: "Fine-tuned model (trained on gold)"
            cost: "~$0 (local)"
          - file: "tools/local_llm/training_data.jsonl"
            count: "500+ examples (combined)"
            note: "All validated before use"
            format: |
              {
                "instruction": "Answer based on the provided context.",
                "input": "Context:\n{context}\n\nQuestion: {query}",
                "output": "{answer_with_citations}",
                "metadata": {
                  "spans_used": [...],
                  "citations": [...],
                  "query_embedding": [...]
                }
              }
            count: "500-1000 examples"
        
      - task: citation_training_data
        priority: HIGH
        description: "Create citation-specific training examples"
        output:
          - file: "tools/local_llm/citation_training.jsonl"
            format: |
              {
                "instruction": "Answer the question and cite sources using [N] format.",
                "input": "Context:\n{context}\n\nQuestion: {query}",
                "output": "The answer is X [1]. This is because Y [2].",
                "citation_map": {
                  "[1]": "file.rs:45-67",
                  "[2]": "docs/guide.md:12-34"
                }
              }
        
      - task: data_validation
        priority: CRITICAL
        description: "Validate training data quality with rigorous checks"
        output:
          - file: "tools/local_llm/validate_data.py"
            classes:
              - AnswerValidator
            methods:
              - validate_answer(answer, context, query) -> bool
              - extract_facts(answer) -> List[str]
              - fact_in_context(fact, context) -> bool
              - extract_citations(answer) -> List[str]
              - answers_question(answer, query) -> bool
            checks:
              - All answers have citations
              - Citations point to valid spans
              - Answers are factually correct
              - No hallucinations (all facts in context)
              - Format consistency
              - Actually answers the question
            validation_logic: |
              def validate_answer(answer, context, query):
                  # 1. Check all facts in answer exist in context
                  facts = extract_facts(answer)
                  for fact in facts:
                      assert fact_in_context(fact, context), f"Hallucination: {fact}"
                  
                  # 2. Check citations point to real spans
                  citations = extract_citations(answer)
                  for cite in citations:
                      assert cite in context.spans, f"Invalid citation: {cite}"
                  
                  # 3. Check answer actually answers the question
                  assert answers_question(answer, query), "Doesn't answer the question"
                  
                  return True
            metrics:
              - Citation coverage: >95%
              - Factual accuracy: >90%
              - Format compliance: 100%
              - Hallucination rate: <5%

    success_criteria:
      week_3:
        - "50 gold standard examples generated with GPT-4"
        - "All gold examples validated"
        - "Small model fine-tuned on gold examples"
        - "100 total queries ready"
        decision: "If quality good → proceed to generate 450+ more. If not → improve gold examples."
      
      week_4:
        - "500+ high-quality Q&A pairs generated (50 gold + 450 synthetic)"
        - "All answers validated for accuracy"
        - "Citation format consistent"
        - "Hallucination rate <5%"
        - "Training data ready for fine-tuning"
        decision: "If data quality sufficient → proceed to fine-tuning. If not → generate more/better data."

  phase_3_fine_tuning:
    name: "Model Fine-Tuning"
    weeks: 5-6
    objective: "Fine-tune small model on training data"
    
    deliverables:
      - task: setup_training_infrastructure
        priority: CRITICAL
        description: "Setup training environment"
        output:
          - file: "tools/local_llm/requirements.txt"
            dependencies:
              - transformers
              - peft
              - bitsandbytes
              - accelerate
              - datasets
              - vllm
          - file: "tools/local_llm/training_config.yaml"
            config:
              base_model: "microsoft/phi-3-mini"
              quantization: "4-bit"
              lora_r: 16
              lora_alpha: 32
              learning_rate: 2e-4
              num_epochs: 3
              batch_size: 4
              gradient_accumulation: 4
        
      - task: fine_tuning_script
        priority: CRITICAL
        description: "Fine-tune model with QLoRA"
        output:
          - file: "tools/local_llm/fine_tune.py"
            classes:
              - LocalLLMTrainer
            methods:
              - setup_model() -> None
              - prepare_for_fine_tuning() -> None
              - fine_tune_on_avocado_data(path: str) -> None
              - save_model(path: str) -> None
            features:
              - 4-bit quantization
              - LoRA adapters
              - Gradient checkpointing
              - Mixed precision training
        
      - task: training_monitoring
        priority: HIGH
        description: "Monitor training progress"
        output:
          - file: "tools/local_llm/training_monitor.py"
            metrics:
              - Loss curves
              - Learning rate schedule
              - GPU utilization
              - Training speed
              - Checkpoint saving
        
      - task: model_checkpoints
        priority: CRITICAL
        description: "Save model checkpoints"
        output:
          - directory: "models/avocado-llm/"
            structure: |
              models/avocado-llm/
                ├── adapter_config.json
                ├── adapter_model.bin
                ├── training_args.json
                └── checkpoint-{step}/

    success_criteria:
      - "Model fine-tuned successfully"
      - "Training loss converges"
      - "No catastrophic forgetting"
      - "Model checkpoints saved"

  phase_4_evaluation:
    name: "Comprehensive Evaluation"
    weeks: 6-7
    objective: "Evaluate fine-tuned model against all metrics"
    
    deliverables:
      - task: evaluation_framework
        priority: CRITICAL
        description: "Comprehensive evaluation system"
        output:
          - file: "tools/local_llm/evaluation.py"
            classes:
              - ModelEvaluator
            methods:
              - evaluate(model) -> Dict[str, float]
              - measure_accuracy(model) -> float
              - measure_citation_accuracy(model) -> float
              - measure_latency(model) -> float
              - detect_hallucinations(model) -> float
              - check_determinism(model) -> bool  # CRITICAL
              - compare_to_baseline(model) -> Dict
        
      - task: determinism_testing
        priority: CRITICAL
        description: "Ensure model maintains determinism"
        output:
          - file: "tools/local_llm/test_determinism.py"
            tests:
              - Same query → same answer (100 runs)
              - Same context → same answer
              - Temperature=0 consistency
              - Seed reproducibility
            requirement: "100% deterministic"
        
      - task: citation_evaluation
        priority: CRITICAL
        description: "Evaluate citation generation"
        output:
          - file: "tools/local_llm/test_citations.py"
            metrics:
              - Citation format accuracy
              - Citation correctness (point to right code)
              - Citation completeness
              - Citation relevance
            target: ">95% citation accuracy"
        
      - task: baseline_comparison
        priority: HIGH
        description: "Compare to RAG-only baseline"
        output:
          - file: "tools/local_llm/compare_baseline.py"
            comparisons:
              - Accuracy: fine-tuned vs RAG-only
              - Latency: fine-tuned vs RAG-only
              - Citation quality: fine-tuned vs RAG-only
              - Determinism: fine-tuned vs RAG-only
            decision_criteria: |
              Fine-tune if:
              - Accuracy improvement >10%
              - Latency improvement >50%
              - Determinism maintained
              - Citation quality maintained or improved

    success_criteria:
      - "Determinism: 100% (same query → same answer)"
      - "Citation accuracy: >95%"
      - "Answer accuracy: >85% (vs GPT-4 baseline)"
      - "Latency: <200ms"
      - "Hallucination rate: <5%"
      - "Better than RAG-only baseline"

  phase_5_integration:
    name: "Integration & Production"
    weeks: 7-8
    objective: "Integrate fine-tuned model with AvocadoDB"
    
    deliverables:
      - task: local_llm_service
        priority: CRITICAL
        description: "Production-ready local LLM service"
        output:
          - file: "tools/local_llm/local_llm_service.py"
            classes:
              - AvocadoLocalLLM
            methods:
              - __init__(avocado_db, model_path, use_vllm=True)
              - query(question: str, budget: int) -> Dict
              - format_prompt(question: str, context: str) -> str
              - generate_with_confidence(query: str) -> Dict
            features:
              - vLLM integration
              - Confidence scoring
              - Multi-turn conversation support
              - Citation generation
        
      - task: vllm_setup
        priority: CRITICAL
        description: "Setup vLLM for fast inference"
        output:
          - file: "tools/local_llm/serve_vllm.sh"
            script: |
              python -m vllm.entrypoints.openai.api_server \
                --model ./models/avocado-llm \
                --port 8080 \
                --tensor-parallel-size 1 \
                --gpu-memory-utilization 0.9
          - file: "tools/local_llm/vllm_client.py"
            classes:
              - VLLMClient
        
      - task: confidence_scoring
        priority: HIGH
        description: "Add confidence scoring to answers"
        output:
          - file: "tools/local_llm/confidence.py"
            classes:
              - ConfidenceScorer
            methods:
              - assess_context_quality(context: WorkingSet) -> float
              - assess_answer_quality(answer: str, context: WorkingSet) -> float
              - combined_confidence(context_quality, answer_quality) -> float
        
      - task: multi_turn_support
        priority: HIGH
        description: "Support multi-turn conversations"
        output:
          - file: "tools/local_llm/conversation.py"
            classes:
              - ConversationalAvocadoLLM
            methods:
              - chat(message: str, conversation_id: str) -> Dict
              - expand_query_with_history(message: str, history: List) -> str
              - build_conversational_prompt(message, context, history) -> str
        
      - task: codebase_update_strategy
        priority: HIGH
        description: "Handle codebase updates with explicit logic"
        output:
          - file: "tools/local_llm/update_handler.py"
            classes:
              - UpdateStrategy
            methods:
              - handle_codebase_update(changes: List[str]) -> str
              - is_core_change(changes: List[str]) -> bool
              - should_retrain(changes: List[str]) -> bool
              - incremental_retrain(changes: List[str]) -> None
            implementation: |
              class UpdateStrategy:
                  CORE_PATHS = [
                      "compiler.rs", "span.rs", "types.rs", 
                      "db.rs", "index.rs"
                  ]
                  
                  def handle_codebase_update(self, changed_files: List[str]) -> str:
                      """Handle codebase updates intelligently."""
                      
                      # Always re-index changed files (RAG handles it)
                      db.reingest(changed_files)
                      
                      # Decide on retraining
                      if self.is_core_change(changed_files):
                          print("Core change detected - consider retraining")
                          return "RETRAIN_SUGGESTED"
                      
                      # For most changes, RAG handles it automatically
                      return "RAG_SUFFICIENT"
                  
                  def is_core_change(self, files: List[str]) -> bool:
                      """Check if core algorithms changed."""
                      return any(
                          any(core in f for core in self.CORE_PATHS)
                          for f in files
                      )
                  
                  def should_retrain(self, changes: List[str]) -> bool:
                      """Decide if retraining is needed."""
                      # Retrain if:
                      # - Core algorithms changed
                      # - API contracts changed
                      # - >20% of codebase changed
                      # - Architecture significantly changed
                      
                      if self.is_core_change(changes):
                          return True
                      
                      if len(changes) > 0.2 * total_files:
                          return True
                      
                      return False
            strategy: |
              - Always re-ingest changed files (RAG handles updates)
              - Retrain only if:
                * Core algorithms changed (compiler.rs, span.rs, etc.)
                * API contracts changed
                * >20% of codebase changed
                * Architecture significantly changed
              - Otherwise rely on RAG (automatic updates)
              - Hybrid approach: RAG for updates, fine-tuned for speed
        
      - task: http_api
        priority: CRITICAL
        description: "HTTP API for local LLM service"
        output:
          - file: "tools/local_llm/api.py"
            endpoints:
              - POST /local_query
                request: {query: str, budget: int, conversation_id: Optional[str]}
                response: {answer: str, citations: List, confidence: float, latency_ms: float}
              - GET /health
              - POST /conversations
              - GET /conversations/:id
        
      - task: monitoring
        priority: HIGH
        description: "Monitoring and observability"
        output:
          - file: "tools/local_llm/monitor.py"
            metrics:
              - Query latency
              - Answer quality scores
              - Citation accuracy
              - Determinism violations
              - Model confidence distribution
              - Error rates

    success_criteria:
      - "Local LLM service running with vLLM"
      - "API endpoints functional"
      - "Multi-turn conversations working"
      - "Confidence scoring implemented"
      - "Update strategy documented"
      - "Monitoring in place"

# Success metrics
success_metrics:
  accuracy:
    target: ">85% (vs GPT-4 baseline)"
    measurement: "Semantic similarity to ground truth"
    
  citation_accuracy:
    target: ">95%"
    measurement: "Citations point to correct code spans"
    
  determinism:
    target: "100%"
    measurement: "Same query → same answer (100 runs)"
    critical: true  # Non-negotiable
    
  latency:
    target: "<200ms"
    measurement: "End-to-end query time"
    
  context_utilization:
    target: ">80%"
    measurement: "Tokens used / budget"
    
  hallucination_rate:
    target: "<5%"
    measurement: "Answers not supported by context"
    
  confidence_calibration:
    target: "Well-calibrated"
    measurement: "High confidence = high accuracy"

# Risk mitigations
risks:
  - risk: "Fine-tuning breaks determinism"
    severity: CRITICAL
    mitigation: |
      - Test determinism after every training step
      - Use temperature=0, deterministic sampling
      - Validate with 100-run test
      - If broken, revert to RAG-only
    detection: "Determinism test suite"
    
  - risk: "Poor training data quality"
    severity: HIGH
    mitigation: |
      - Use GPT-4 for answer generation
      - Validate all answers manually
      - Check citation accuracy
      - Remove low-quality examples
    detection: "Data validation pipeline"
    
  - risk: "Model doesn't improve over RAG"
    severity: MEDIUM
    mitigation: |
      - Compare to baseline before deploying
      - Only deploy if >10% improvement
      - Keep RAG as fallback
      - Document decision criteria
    detection: "Baseline comparison"
    
  - risk: "Codebase updates require frequent retraining"
    severity: MEDIUM
    mitigation: |
      - Use hybrid RAG + fine-tuned approach
      - Only retrain on major changes
      - RAG handles updates automatically
      - Document update strategy
    detection: "Update handler logic"
    
  - risk: "Citation generation quality drops"
    severity: HIGH
    mitigation: |
      - Dedicated citation training data
      - Citation-specific evaluation
      - Format validation
      - Post-processing if needed
    detection: "Citation evaluation metrics"

# Decision points
decision_points:
  day_1_checkpoint:
    question: "Does ultra-minimal POC work? (1 file, 1 query)"
    criteria:
      - 1 query returns answer
      - Answer makes sense (human eval)
      - Citations present
      - Deterministic (2 runs)
    go_decision: "Proceed to 10 queries"
    no_go_decision: "Fix RAG system first, re-test minimal POC"
    timeline: "Can run TODAY, results in < 1 hour"
    
  week_1_checkpoint:
    question: "Does 10-query POC work?"
    criteria:
      - 10 queries return answers
      - Accuracy >70%
      - Citations work
      - Deterministic
    go_decision: "Proceed to Week 2 (scale to 100 queries)"
    no_go_decision: "Improve RAG system first, re-test POC"
    
  week_2_checkpoint:
    question: "Should we proceed with fine-tuning?"
    criteria:
      - RAG-only accuracy >80%
      - Test set created (100 examples)
      - Evaluation framework working
      - Determinism: 100% (100-run test)
    go_decision: "Proceed to training data generation"
    no_go_decision: "Stick with RAG-only (it works!), or improve RAG system"
    
  week_3_checkpoint:
    question: "Are gold examples high quality?"
    criteria:
      - 50 gold examples generated
      - All validated (no hallucinations)
      - Citation accuracy >95%
      - Small model fine-tuned successfully
    go_decision: "Proceed to generate 450+ synthetic examples"
    no_go_decision: "Improve gold examples, re-generate"
    
  week_4_checkpoint:
    question: "Is training data quality sufficient?"
    criteria:
      - 500+ high-quality examples (50 gold + 450 synthetic)
      - Citation accuracy >95%
      - All answers validated
      - Hallucination rate <5%
    go_decision: "Proceed to fine-tuning"
    no_go_decision: "Generate more/better training data"
    
  week_6_checkpoint:
    question: "Does fine-tuned model meet criteria?"
    criteria:
      - Determinism: 100%
      - Accuracy >85%
      - Citation accuracy >95%
      - Better than RAG baseline
    go_decision: "Proceed to integration"
    no_go_decision: "Stick with RAG-only, or retrain with different config"
    
  week_8_checkpoint:
    question: "Ready for production?"
    criteria:
      - All metrics met
      - Monitoring in place
      - Documentation complete
      - Update strategy defined
    go_decision: "Deploy to production"
    no_go_decision: "Address remaining issues"

# Timeline summary
timeline:
  day_1:
    focus: "Ultra-minimal POC - 1 file, 1 query, 1 model"
    deliverable: "Proof concept works (can run TODAY)"
    decision: "If works → scale to 10 queries. If not → fix RAG."
  
  week_1:
    focus: "Scale to 10 queries + TinyLlama, full POC"
    deliverable: "10-query POC working, 70%+ accuracy, deterministic"
    decision: "If succeeds → Week 2. If not → improve RAG first."
    
  week_2:
    focus: "Scale to 100 queries, full RAG evaluation"
    deliverable: "RAG service complete, 100 test queries, evaluation framework"
    decision: "If 80%+ accuracy → proceed to training data. If not → stick with RAG-only."
    
  week_3:
    focus: "Generate 50 gold examples, fine-tune answer generator"
    deliverable: "50 gold examples, small model fine-tuned, 100 queries ready"
    decision: "If quality good → generate 450+ more. If not → improve gold examples."
    
  week_4:
    focus: "Generate 450+ synthetic examples, validate all data"
    deliverable: "500+ validated Q&A pairs ready for fine-tuning"
    decision: "If data quality sufficient → proceed. If not → generate more/better data."
    
  week_5:
    focus: "Fine-tuning setup and execution"
    deliverable: "Fine-tuned model checkpoints"
    
  week_6:
    focus: "Comprehensive evaluation"
    deliverable: "Evaluation report, GO/NO-GO decision"
    
  week_7:
    focus: "Integration and production setup"
    deliverable: "Local LLM service running"
    
  week_8:
    focus: "Monitoring, documentation, launch"
    deliverable: "Production-ready system"

# Definition of done
done_when:
  - "Local LLM answers codebase questions with >85% accuracy"
  - "100% deterministic (same query → same answer)"
  - "Citation accuracy >95%"
  - "Latency <200ms"
  - "Better than RAG-only baseline"
  - "Multi-turn conversations supported"
  - "Confidence scoring implemented"
  - "Update strategy documented"
  - "Monitoring and observability in place"
  - "All tests passing"
  - "Documentation complete"

# The one metric that matters
north_star_metric: |
  A developer can query the AvocadoDB codebase using a local LLM that:
  - Answers questions with 85%+ accuracy
  - Maintains 100% determinism (non-negotiable)
  - Generates accurate citations (>95%)
  - Responds in <200ms (fine-tuned) or <500ms (RAG-only)
  - Requires no external API keys for inference
  - Works even if fine-tuning fails (RAG-only fallback)

# Key insight: Even if fine-tuning fails, RAG-only still works!
# This is a win-win strategy - you can't lose.

