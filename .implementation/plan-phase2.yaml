# AvocadoDB Phase 2 - Knowledge Base & Agent Memory
# Implementation plan for session management, memory extraction, and framework integrations

metadata:
  project: AvocadoDB
  phase: 2
  version: 2.0.0
  duration: 12_weeks
  start_date: "2025-04-01"  # After Phase 1 completion
  core_objective: "Enable agent memory and learning capabilities"
  success_metric: "Agents can remember conversations and learn from interactions"

# Global configuration (inherits from Phase 1)
global_config:
  repository: "github.com/avocadodb/avocadodb"
  language: rust
  min_rust_version: "1.75.0"
  database: sqlite  # Still SQLite, Postgres in Phase 3

  tech_stack:
    core_engine: rust
    cli: rust + clap
    python_sdk: python + requests
    embedding_provider: openai  # Still OpenAI for now
    vector_index: in_memory

  conventions:
    error_handling: "Result<T, Error> with thiserror"
    logging: "env_logger"
    serialization: "serde + serde_json"
    async_runtime: "tokio"
    database: "rusqlite"
    http_server: "axum"

# Phase 2 priorities (in order)
priorities:
  - priority: 1
    name: "Session Management"
    description: "Track conversation history and enable debugging/replay"
    weeks: 1-4
    
  - priority: 2
    name: "Memory Extraction Pipeline"
    description: "Extract and store persistent knowledge from sessions"
    weeks: 5-8
    
  - priority: 3
    name: "Framework Integrations"
    description: "LangChain, LlamaIndex adapters for easy adoption"
    weeks: 9-12

# MUST HAVE - Core deliverables for Phase 2
must_have:
  priority_1_session_management:
    weeks: 1-4
    deliverables:
      - task: session_schema
        priority: CRITICAL
        output:
          - file: "migrations/002_sessions.sql"
            schema: |
              -- Sessions table: tracks conversation sessions
              CREATE TABLE IF NOT EXISTS sessions (
                  id TEXT PRIMARY KEY,
                  user_id TEXT,
                  title TEXT,
                  metadata TEXT,
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  last_message_at TIMESTAMP
              );
              
              -- Messages table: stores individual conversation turns
              CREATE TABLE IF NOT EXISTS messages (
                  id TEXT PRIMARY KEY,
                  session_id TEXT NOT NULL,
                  role TEXT NOT NULL,
                  content TEXT NOT NULL,
                  metadata TEXT,
                  sequence_number INTEGER NOT NULL,
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  FOREIGN KEY (session_id) REFERENCES sessions(id) ON DELETE CASCADE
              );
              
              -- Working set associations
              CREATE TABLE IF NOT EXISTS session_working_sets (
                  id TEXT PRIMARY KEY,
                  session_id TEXT NOT NULL,
                  message_id TEXT,
                  working_set_id TEXT NOT NULL,
                  query TEXT NOT NULL,
                  config TEXT,
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  FOREIGN KEY (session_id) REFERENCES sessions(id) ON DELETE CASCADE,
                  FOREIGN KEY (message_id) REFERENCES messages(id) ON DELETE SET NULL
              );
              
              -- Indexes
              CREATE INDEX IF NOT EXISTS idx_sessions_user ON sessions(user_id);
              CREATE INDEX IF NOT EXISTS idx_sessions_updated ON sessions(updated_at DESC);
              CREATE INDEX IF NOT EXISTS idx_messages_session ON messages(session_id, sequence_number);
              CREATE INDEX IF NOT EXISTS idx_working_sets_session ON session_working_sets(session_id);

      - task: session_types
        priority: CRITICAL
        output:
          - file: "avocado-core/src/types.rs"
            additions:
              - Session struct
              - Message struct
              - MessageRole enum
              - SessionWorkingSet struct
              - SessionWithMessages struct

      - task: session_database_ops
        priority: CRITICAL
        output:
          - file: "avocado-core/src/db.rs"
            functions:
              - create_session
              - get_session
              - list_sessions
              - update_session
              - delete_session
              - add_message
              - get_messages
              - associate_working_set
              - get_session_full

      - task: session_manager
        priority: CRITICAL
        output:
          - file: "avocado-core/src/session.rs" (new)
            functions:
              - start_session
              - add_user_message (integrates with compiler)
              - add_assistant_message
              - get_conversation_history (with token limiting)
              - replay_session

      - task: session_http_api
        priority: CRITICAL
        output:
          - file: "avocado-server/src/main.rs"
            endpoints:
              - POST /sessions
              - GET /sessions
              - GET /sessions/:id
              - POST /sessions/:id/messages
              - POST /sessions/:id/compile
              - GET /sessions/:id/history
              - DELETE /sessions/:id

      - task: session_python_sdk
        priority: CRITICAL
        output:
          - file: "sdks/python/avocado/session.py" (new)
            classes:
              - Session class
              - AvocadoDB.session methods

      - task: session_cli
        priority: CRITICAL
        output:
          - file: "avocado-cli/src/main.rs"
            commands:
              - session create
              - session list
              - session show
              - session message
              - session compile
              - session history
              - session replay
              - session delete

      - task: session_tests
        priority: CRITICAL
        output:
          - file: "tests/session.rs" (new)
            tests:
              - Session CRUD operations
              - Message ordering
              - Working set associations
              - Conversation history token limiting
              - Session replay accuracy

  priority_2_memory_extraction:
    weeks: 5-8
    deliverables:
      - task: memory_schema
        priority: CRITICAL
        output:
          - file: "migrations/003_memories.sql"
            schema: |
              -- Memories table: extracted persistent knowledge
              CREATE TABLE IF NOT EXISTS memories (
                  id TEXT PRIMARY KEY,
                  user_id TEXT,
                  session_id TEXT,
                  memory_type TEXT NOT NULL,  -- 'fact', 'preference', 'pattern', 'summary'
                  content TEXT NOT NULL,
                  confidence REAL,
                  metadata TEXT,
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  FOREIGN KEY (session_id) REFERENCES sessions(id) ON DELETE SET NULL
              );
              
              -- Memory associations (for consolidation)
              CREATE TABLE IF NOT EXISTS memory_links (
                  id TEXT PRIMARY KEY,
                  memory_id TEXT NOT NULL,
                  related_memory_id TEXT NOT NULL,
                  relationship_type TEXT,  -- 'duplicate', 'contradicts', 'extends'
                  FOREIGN KEY (memory_id) REFERENCES memories(id) ON DELETE CASCADE,
                  FOREIGN KEY (related_memory_id) REFERENCES memories(id) ON DELETE CASCADE
              );
              
              -- Indexes
              CREATE INDEX IF NOT EXISTS idx_memories_user ON memories(user_id);
              CREATE INDEX IF NOT EXISTS idx_memories_type ON memories(memory_type);
              CREATE INDEX IF NOT EXISTS idx_memories_session ON memories(session_id);

      - task: memory_types
        priority: CRITICAL
        output:
          - file: "avocado-core/src/types.rs"
            additions:
              - Memory struct
              - MemoryType enum
              - MemoryLink struct

      - task: memory_extractor
        priority: CRITICAL
        output:
          - file: "avocado-core/src/memory.rs" (new)
            functions:
              - extract_memories_from_session (LLM-driven extraction)
              - consolidate_memories (merge/update existing)
              - retrieve_memories_for_query (semantic search)
              - delete_memory
              - update_memory

      - task: memory_database_ops
        priority: CRITICAL
        output:
          - file: "avocado-core/src/db.rs"
            functions:
              - insert_memory
              - get_memory
              - list_memories
              - update_memory
              - delete_memory
              - search_memories (semantic + lexical)

      - task: memory_integration
        priority: CRITICAL
        output:
          - file: "avocado-core/src/compiler.rs"
            changes:
              - Add "memory" channel to compilation
              - Retrieve relevant memories during compilation
              - Include memories in working set

      - task: memory_http_api
        priority: CRITICAL
        output:
          - file: "avocado-server/src/main.rs"
            endpoints:
              - POST /sessions/:id/extract-memories
              - GET /memories
              - GET /memories/:id
              - PUT /memories/:id
              - DELETE /memories/:id
              - POST /memories/consolidate

      - task: memory_python_sdk
        priority: CRITICAL
        output:
          - file: "sdks/python/avocado/memory.py" (new)
            classes:
              - Memory class
              - MemoryManager class

      - task: memory_cli
        priority: CRITICAL
        output:
          - file: "avocado-cli/src/main.rs"
            commands:
              - memory extract <session-id>
              - memory list [--user-id]
              - memory show <memory-id>
              - memory delete <memory-id>
              - memory consolidate

      - task: memory_tests
        priority: CRITICAL
        output:
          - file: "tests/memory.rs" (new)
            tests:
              - Memory extraction accuracy
              - Memory consolidation logic
              - Memory retrieval in compilation
              - Memory deduplication

  priority_3_framework_integrations:
    weeks: 9-12
    deliverables:
      - task: langchain_integration
        priority: HIGH
        output:
          - file: "sdks/python/avocado/integrations/langchain.py"
            classes:
              - AvocadoDBRetriever (LangChain BaseRetriever)
              - AvocadoDBSessionMemory (LangChain BaseMemory)
            features:
              - Drop-in replacement for vector store retrievers
              - Session-aware memory integration
              - Memory-backed context retrieval

      - task: llamaindex_integration
        priority: HIGH
        output:
          - file: "sdks/python/avocado/integrations/llamaindex.py"
            classes:
              - AvocadoDBRetriever (LlamaIndex BaseRetriever)
              - AvocadoDBMemoryStore (LlamaIndex BaseMemoryStore)
            features:
              - Compatible with LlamaIndex query engine
              - Memory integration
              - Session support

      - task: integration_examples
        priority: HIGH
        output:
          - file: "sdks/python/examples/langchain_integration.py"
          - file: "sdks/python/examples/llamaindex_integration.py"
          - file: "docs/framework-integrations.md"

      - task: integration_tests
        priority: HIGH
        output:
          - file: "tests/integrations.rs" (or Python tests)
            tests:
              - LangChain retriever compatibility
              - LlamaIndex retriever compatibility
              - Memory integration works
              - Session persistence

# NICE TO HAVE - Can defer to Phase 2.1 or Phase 3
nice_to_have:
  session_summarization:
    description: "Auto-generate session titles using LLM"
    complexity: "Requires LLM call, adds latency"
    defer_to: "Phase 2.1"

  cross_session_search:
    description: "Search across multiple sessions"
    complexity: "Requires indexing session content"
    defer_to: "Phase 2.1"

  memory_embeddings:
    description: "Store embeddings for memories (currently just text)"
    complexity: "Adds storage overhead, but improves retrieval"
    defer_to: "Phase 2.1"

  advanced_memory_consolidation:
    description: "LLM-driven memory consolidation with conflict resolution"
    complexity: "Requires sophisticated prompt engineering"
    defer_to: "Phase 2.1"

  postgres_support:
    description: "PostgreSQL backend for scaling"
    complexity: "Different schema, connection pooling"
    defer_to: "Phase 3"

  multi_agent_coordination:
    description: "Shared working sets, file locking"
    complexity: "Requires distributed coordination"
    defer_to: "Phase 3"

# Success criteria
success_criteria:
  week_4_checkpoint:
    - "Can create and manage sessions"
    - "Messages stored in correct order"
    - "Working sets associated with sessions"
    - "Session replay works"
    - "HTTP API supports all session operations"

  week_8_checkpoint:
    - "Can extract memories from sessions"
    - "Memories stored and retrievable"
    - "Memory consolidation works"
    - "Memories included in context compilation"
    - "Memory API complete"

  week_12_launch:
    technical:
      - "Sessions fully functional"
      - "Memory extraction pipeline working"
      - "LangChain integration complete"
      - "LlamaIndex integration complete"
      - "All tests passing"

    product:
      - "Can build agent with memory in < 10 minutes"
      - "Framework integrations work as drop-in replacements"
      - "Clear examples for each integration"

    community:
      - "Integration tutorials published"
      - "Example agents using AvocadoDB memory"
      - "Community feedback incorporated"

# Explicit non-goals for Phase 2
non_goals:
  - "Multi-agent coordination (Phase 3)"
  - "PostgreSQL support (Phase 3)"
  - "Enterprise governance (Phase 4)"
  - "WASM policy engine (Phase 4)"
  - "Artifact versioning (Phase 3)"
  - "Advanced retrieval algorithms (BM25, learned rankers)"

# Risk mitigations
risks:
  - risk: "Memory extraction quality inconsistent"
    mitigation: |
      - Start with simple extraction (key facts, preferences)
      - Use structured prompts for consistency
      - Allow manual memory editing
      - Provide confidence scores

  - risk: "Memory consolidation conflicts"
    mitigation: |
      - Start with simple deduplication
      - Flag conflicts for manual review
      - Use timestamps to resolve conflicts
      - Can improve with LLM-driven consolidation later

  - risk: "Framework integration complexity"
    mitigation: |
      - Start with minimal viable integrations
      - Focus on most common use cases
      - Provide clear migration guides
      - Community can help with edge cases

  - risk: "Performance impact of memory retrieval"
    mitigation: |
      - Cache memory embeddings
      - Limit memory search to top-k
      - Make memory channel optional in compilation
      - Profile and optimize hot paths

# Week-by-week timeline
timeline:
  week_1:
    goals: "Session schema and types"
    deliverable: "Database migration, Rust types defined"
    
  week_2:
    goals: "Session database operations"
    deliverable: "Can create sessions, add messages, associate working sets"
    
  week_3:
    goals: "Session manager and HTTP API"
    deliverable: "High-level session API, REST endpoints working"
    
  week_4:
    goals: "SDKs and CLI, testing"
    deliverable: "Python SDK, CLI commands, session tests passing"
    checkpoint: "GO/NO-GO for memory extraction"
    
  week_5:
    goals: "Memory schema and types"
    deliverable: "Memory tables, Rust types"
    
  week_6:
    goals: "Memory extraction pipeline"
    deliverable: "Can extract memories from sessions using LLM"
    
  week_7:
    goals: "Memory consolidation and retrieval"
    deliverable: "Memories consolidated, retrieved in compilation"
    
  week_8:
    goals: "Memory APIs and testing"
    deliverable: "HTTP API, SDKs, CLI, tests complete"
    checkpoint: "GO/NO-GO for framework integrations"
    
  week_9:
    goals: "LangChain integration"
    deliverable: "AvocadoDBRetriever and AvocadoDBSessionMemory working"
    
  week_10:
    goals: "LlamaIndex integration"
    deliverable: "AvocadoDB retriever and memory store for LlamaIndex"
    
  week_11:
    goals: "Integration examples and docs"
    deliverable: "Tutorials, examples, migration guides"
    
  week_12:
    goals: "Polish, testing, launch prep"
    deliverable: "All tests passing, docs complete, ready for release"

# Definition of done for Phase 2
done_when:
  - "Session management fully functional"
  - "Memory extraction pipeline working"
  - "LangChain integration published"
  - "LlamaIndex integration published"
  - "Integration examples in repo"
  - "Phase 2 documentation complete"
  - "All Phase 2 tests passing"
  - "Backward compatible with Phase 1"

# The one metric that matters
north_star_metric: |
  A developer can build an agent that remembers conversations and learns
  user preferences, using AvocadoDB as the memory layer, in under 10 minutes.


