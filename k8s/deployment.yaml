apiVersion: apps/v1
kind: Deployment
metadata:
  name: avocadodb
  labels:
    app: avocadodb
    component: server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: avocadodb
      component: server
  template:
    metadata:
      labels:
        app: avocadodb
        component: server
    spec:
      containers:
      - name: avocadodb
        image: avocadodb/avocadodb:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8765
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8765"
        - name: RUST_LOG
          valueFrom:
            configMapKeyRef:
              name: avocadodb-config
              key: log_level
        - name: AVOCADODB_EMBEDDING_MODEL
          valueFrom:
            configMapKeyRef:
              name: avocadodb-config
              key: embedding_model
        - name: AVOCADODB_EMBEDDING_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: avocadodb-config
              key: embedding_provider
              optional: true
        # Optional: OpenAI API key from secret
        # - name: OPENAI_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: avocadodb-secrets
        #       key: openai_api_key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: avocadodb-pvc
      securityContext:
        fsGroup: 1000
      # Optional: node affinity for specific nodes
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #       - matchExpressions:
      #         - key: node-role.kubernetes.io/worker
      #           operator: In
      #           values:
      #           - "true"
