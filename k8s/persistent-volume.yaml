apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: avocadodb-pvc
  labels:
    app: avocadodb
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Optional: specify storage class
  # storageClassName: fast-ssd

