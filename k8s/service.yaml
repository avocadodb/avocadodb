apiVersion: v1
kind: Service
metadata:
  name: avocadodb
  labels:
    app: avocadodb
    component: server
spec:
  type: ClusterIP
  selector:
    app: avocadodb
    component: server
  ports:
  - name: http
    port: 8765
    targetPort: http
    protocol: TCP
  sessionAffinity: None

