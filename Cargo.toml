[workspace]
members = ["avocado-core", "avocado-cli", "avocado-server", "tests"]
resolver = "2"

[workspace.package]
version = "2.0.0"
authors = ["AvocadoDB Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/avocadodb/avocadodb"
homepage = "https://avocadodb.ai"
documentation = "https://docs.rs/avocado-core"
keywords = ["rag", "vector-database", "embeddings", "ai", "llm"]
categories = ["database", "text-processing"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# HTTP client & server
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tower = "0.4"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
parking_lot = "0.12"

# Logging
env_logger = "0.11"
log = "0.4"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Token counting (for accurate token estimation)
tiktoken-rs = "0.5"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
