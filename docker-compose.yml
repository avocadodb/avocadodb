version: '3.8'

services:
  avocado-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: avocadodb/avocadodb:latest
    container_name: avocadodb-server
    ports:
      - "8765:8765"
    volumes:
      # Persist database and data
      - avocado-data:/data
      # Optional: Mount local directory for development
      # - ./local-data:/data
    environment:
      # Server configuration
      - PORT=8765
      - RUST_LOG=info

      # Embedding configuration
      # By default, uses Pure Rust embeddings (fastembed) - no API key needed!
      # Uncomment to use OpenAI embeddings instead:
      # - AVOCADODB_EMBEDDING_PROVIDER=openai
      # - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Model selection (for fastembed)
      # Options: minilm (384d), nomic/nomicv15 (768d), bgelarge (1024d)
      - AVOCADODB_EMBEDDING_MODEL=minilm

      # Performance tuning
      # - MAX_PROJECTS_IN_MEMORY=10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "command -v curl >/dev/null && curl -f http://localhost:8765/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - avocado-network

  # PostgreSQL with AvocadoDB Extension (pgvector + avocado)
  # Usage: docker compose --profile pgext up -d postgres-avocado
  # Then connect: psql postgres://avocado:changeme@localhost:5432/avocadodb
  postgres-avocado:
    build:
      context: .
      dockerfile: avocado-pgext/Dockerfile
    image: avocadodb/postgres:pg16
    container_name: avocadodb-postgres-ext
    profiles: ["pgext"]  # Only starts with: docker compose --profile pgext up
    environment:
      - POSTGRES_DB=avocadodb
      - POSTGRES_USER=avocado
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      # Embedding provider: fastembed (default), ollama, or openai
      - AVOCADO_EMBEDDING_PROVIDER=fastembed
      # Ollama configuration (when using AVOCADO_EMBEDDING_PROVIDER=ollama)
      # - AVOCADO_OLLAMA_URL=http://host.docker.internal:11434
      # - AVOCADO_OLLAMA_MODEL=bge-m3
      # OpenAI configuration (when using AVOCADO_EMBEDDING_PROVIDER=openai)
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "5432:5432"
    volumes:
      - postgres-avocado-data:/var/lib/postgresql/data
    networks:
      - avocado-network
    extra_hosts:
      # Allow container to reach host's Ollama server
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avocado -d avocadodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Plain PostgreSQL with pgvector (no AvocadoDB extension)
  # For use with the Rust server's PostgreSQL backend (deprecated)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: avocadodb-postgres
    profiles: ["postgres"]  # Only starts with: docker compose --profile postgres up
    environment:
      - POSTGRES_DB=avocadodb
      - POSTGRES_USER=avocado
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - avocado-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avocado -d avocadodb"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  avocado-network:
    driver: bridge

volumes:
  avocado-data:
    driver: local
  postgres-data:
    driver: local
  postgres-avocado-data:
    driver: local
