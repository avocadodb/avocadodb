name: Python CI

on:
  push:
    branches: [main, master]
    paths:
      - 'sdks/python/**'
      - 'integrations/**/*.py'
      - 'integrations/**/pyproject.toml'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'sdks/python/**'
      - 'integrations/**/*.py'
      - 'integrations/**/pyproject.toml'
      - '.github/workflows/python.yml'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        working-directory: sdks/python
        run: |
          pytest tests/ -v --cov=avocado --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./sdks/python/coverage.xml
          flags: python-sdk
          name: python-coverage
          token: \${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy types-requests

      - name: Install SDK dependencies
        working-directory: sdks/python
        run: pip install -e .

      - name: Run Black (formatting check)
        working-directory: sdks/python
        run: black --check --diff avocado/ tests/ examples/

      - name: Run Flake8 (linting)
        working-directory: sdks/python
        run: flake8 avocado/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Run MyPy (type checking)
        working-directory: sdks/python
        run: mypy avocado/ --ignore-missing-imports --no-strict-optional

  integration-langchain:
    name: Test LangChain Integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
          cache: 'pip'

      - name: Install LangChain integration
        working-directory: integrations/langchain-avocadodb
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-cov pytest-asyncio

      - name: Run LangChain integration tests
        working-directory: integrations/langchain-avocadodb
        run: |
          pytest tests/ -v --cov=langchain_avocadodb --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./integrations/langchain-avocadodb/coverage.xml
          flags: langchain-integration
          name: langchain-coverage
          token: \${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration-llamaindex:
    name: Test LlamaIndex Integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
          cache: 'pip'

      - name: Install LlamaIndex integration
        working-directory: integrations/llama-index-avocadodb
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-cov pytest-asyncio

      - name: Run LlamaIndex integration tests
        working-directory: integrations/llama-index-avocadodb
        run: |
          pytest tests/ -v --cov=llama_index_avocadodb --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./integrations/llama-index-avocadodb/coverage.xml
          flags: llamaindex-integration
          name: llamaindex-coverage
          token: \${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  check-format:
    name: Verify Package Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build tools
        run: pip install build twine

      - name: Build SDK package
        working-directory: sdks/python
        run: python -m build

      - name: Check package with twine
        working-directory: sdks/python
        run: twine check dist/*

      - name: Build LangChain integration package
        working-directory: integrations/langchain-avocadodb
        run: python -m build

      - name: Check LangChain package
        working-directory: integrations/langchain-avocadodb
        run: twine check dist/*

      - name: Build LlamaIndex integration package
        working-directory: integrations/llama-index-avocadodb
        run: python -m build

      - name: Check LlamaIndex package
        working-directory: integrations/llama-index-avocadodb
        run: twine check dist/*
