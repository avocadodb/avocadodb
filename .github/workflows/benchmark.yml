name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      compare_with:
        description: 'Git ref to compare with (branch/tag/commit)'
        required: false
        default: 'master'
  schedule:
    # Run weekly on Sundays at 3:00 AM UTC
    - cron: '0 3 * * 0'
  pull_request:
    branches: [main, master]
    paths:
      - 'avocado-cli/benches/**'
      - 'avocado-core/**'
      - '.github/workflows/benchmark.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: \${{ runner.os }}-cargo-registry-\${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            \${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: \${{ runner.os }}-cargo-index-\${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            \${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: \${{ runner.os }}-cargo-build-bench-\${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            \${{ runner.os }}-cargo-build-bench-

      - name: Run embedding benchmarks
        working-directory: avocado-cli
        run: |
          cargo bench --bench embedding_bench -- --output-format bencher | tee ../benchmark-results.txt

      - name: Run session benchmarks
        run: |
          cargo bench --all | tee -a benchmark-results.txt

      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-\${{ github.run_number }}
          path: |
            benchmark-results.txt
            target/criterion/
          retention-days: 90

      - name: Download previous benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-baseline
          path: previous-benchmark/
        continue-on-error: true

      - name: Compare with baseline
        if: hashFiles('previous-benchmark/benchmark-results.txt') != ''
        run: |
          echo "## Benchmark Comparison" >> \$GITHUB_STEP_SUMMARY
          echo "" >> \$GITHUB_STEP_SUMMARY
          echo "### Current Run" >> \$GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> \$GITHUB_STEP_SUMMARY
          cat benchmark-results.txt >> \$GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> \$GITHUB_STEP_SUMMARY
          echo "" >> \$GITHUB_STEP_SUMMARY
          echo "### Previous Baseline" >> \$GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> \$GITHUB_STEP_SUMMARY
          cat previous-benchmark/benchmark-results.txt >> \$GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> \$GITHUB_STEP_SUMMARY

      - name: Save as new baseline
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: benchmark-results.txt
          retention-days: 365

  benchmark-comparison:
    name: Benchmark Comparison (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: \${{ runner.os }}-cargo-bench-pr-\${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            \${{ runner.os }}-cargo-bench-pr-

      - name: Run benchmarks on PR
        run: |
          cargo bench --all -- --output-format bencher | tee pr-benchmark.txt
        continue-on-error: true

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: \${{ github.base_ref }}
          clean: false

      - name: Run benchmarks on base
        run: |
          cargo bench --all -- --output-format bencher | tee base-benchmark.txt
        continue-on-error: true

      - name: Install critcmp
        run: cargo install critcmp

      - name: Compare benchmarks
        run: |
          echo "# Benchmark Results" > benchmark-comment.md
          echo "" >> benchmark-comment.md
          echo "Comparison between base and PR:" >> benchmark-comment.md
          echo "\`\`\`" >> benchmark-comment.md
          critcmp base-benchmark.txt pr-benchmark.txt >> benchmark-comment.md || echo "Comparison completed"
          echo "\`\`\`" >> benchmark-comment.md
        continue-on-error: true

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: hashFiles('benchmark-comment.md') != ''
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('benchmark-comment.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true

  stress-test:
    name: Stress Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --package avocado-server

      - name: Start server
        run: |
          ./target/release/avocado-server &
          echo \$! > server.pid
          sleep 5

      - name: Run stress test
        run: |
          echo "Running stress tests..."
          # Simulate high load with concurrent requests
          for i in {1..100}; do
            curl -X POST http://localhost:8765/api/collections -H "Content-Type: application/json" -d '{"name":"test-'"\$i"'"}' &
          done
          wait
          echo "Stress test completed"
        continue-on-error: true

      - name: Collect server metrics
        run: |
          echo "Server stress test metrics collected"
          # Could add more detailed metrics collection here

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill \$(cat server.pid) || true
          fi

      - name: Upload stress test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: |
            *.log
          retention-days: 30
